<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar">

        <header>
            <p id="calendar-title">CALENDAR</p>
        </header>

        <main>

            <div class="top">
                <p id="day"></p>
                <p id="year"></p>
            </div>

            <div class="date">
                <p id="date"></p>
            </div>

            <p id="month"></p>

        </main>

    </div>

    <script src="renderer.js"></script>

</body>

</html>
